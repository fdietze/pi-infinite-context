name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain (node, tsgo, oxlint) comes from the flake dev shell; type
      # libraries come from `npm ci`. https://github.com/NixOS/nix-installer
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix develop --command npm ci
      - run: nix develop --command npm run ci

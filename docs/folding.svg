<svg xmlns="http://www.w3.org/2000/svg" width="520" height="396" viewBox="0 0 520 396" role="img" aria-labelledby="title description">
  <title id="title">Short context, full history</title>
  <desc id="description">The model sees a summary and the current work. Beneath the summary, the archive keeps an earlier summary and later messages. The earlier summary still contains its original messages. These saved contents can be searched and read without sending them all to the model.</desc>

  <!-- KISS: one tree shows what is sent and what stays available, without repeating the same nodes. -->
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 20px; fill: #1f2328; }
    .heading { font-weight: 650; }
    .center { text-anchor: middle; }
    .note { font-size: 18px; fill: #59636e; }
    .message { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
    .summary { fill: #e4f5ed; stroke: #347d59; stroke-width: 1.5; }
    .branch { fill: none; stroke: #8c959f; stroke-width: 2; }
    .divider { stroke: #8c959f; stroke-width: 1; stroke-dasharray: 4 5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .note { fill: #b1bac4; }
      .message { fill: #212830; stroke: #919ba5; }
      .summary { fill: #19382f; stroke: #62b38f; }
      .branch, .divider { stroke: #919ba5; }
    }
  </style>

  <text class="heading" x="20" y="30">Sent to the model</text>
  <rect class="summary" x="20" y="50" width="230" height="56" rx="7"/>
  <text class="center" x="135" y="85">Summary</text>
  <rect class="message" x="280" y="50" width="220" height="56" rx="7"/>
  <text class="center" x="390" y="85">Current work</text>

  <path class="branch" d="M 135 106 V 206"/>
  <line class="divider" x1="20" y1="138" x2="500" y2="138"/>
  <text class="heading" x="280" y="178">Kept in the archive</text>
  <!-- The Map Is Not the Territory: these children stay in the archive, not in the model input. -->
  <path class="branch" d="M 135 206 V 226 M 135 206 H 390 V 226"/>
  <rect class="summary" x="20" y="226" width="230" height="56" rx="7"/>
  <text class="center" x="135" y="261">Earlier summary</text>
  <rect class="message" x="280" y="226" width="220" height="56" rx="7"/>
  <text class="center" x="390" y="261">Later messages</text>

  <path class="branch" d="M 135 282 V 320"/>
  <rect class="message" x="20" y="320" width="230" height="56" rx="7"/>
  <text class="center" x="135" y="355">Original messages</text>
  <text class="note center" x="390" y="341">Search or read<tspan x="390" dy="25">only what you need.</tspan></text>
</svg>
